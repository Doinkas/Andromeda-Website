<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Match Reports — Andromeda Esports</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <p id="admin-matches-gate" class="admin-empty" hidden></p>

  <main id="adminApp" hidden class="admin-shell">
    <header class="admin-topbar">
      <div class="admin-brand">
        <img class="admin-brand__logo" src="../images/branding/andro-org.png" alt="Andromeda logo">
        <div>
          <h1 class="admin-brand__title">Match Reports</h1>
          <p class="admin-brand__subtitle">Official + Scrim history viewer</p>
        </div>
      </div>
      <div class="admin-user">
        <a href="../admin/index.html" class="admin-btn admin-btn--secondary">Admin Dashboard</a>
        <span>Signed in as <strong data-admin-email>—</strong></span>
        <button type="button" class="admin-btn admin-btn--secondary" data-admin-signout>Sign out</button>
      </div>
    </header>

    <section class="admin-card">
      <h2>Filter Reports</h2>
      <div class="admin-grid admin-grid--two">
        <div>
          <label class="admin-label" for="admin-match-type-filter">Type</label>
          <select id="admin-match-type-filter" class="admin-select">
            <option value="all">All</option>
            <option value="official">Official</option>
            <option value="scrim">Scrim</option>
          </select>
        </div>
        <div>
          <label class="admin-label" for="admin-match-team-filter">Team</label>
          <select id="admin-match-team-filter" class="admin-select">
            <option value="">All teams</option>
          </select>
        </div>
      </div>
      <p id="admin-match-status" class="admin-text-muted">Loading match reports...</p>
    </section>

    <section class="admin-card">
      <h2>Reports</h2>
      <div id="admin-match-list" class="admin-grid"></div>
    </section>
  </main>

  <script type="module" src="/js/admin-matches.js"></script>
</body>
</html>
