<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andromeda Admin Matches</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <main id="adminApp" hidden class="admin-shell">
    <header class="admin-topbar">
      <div class="admin-brand">
        <img class="admin-brand__logo" src="../images/branding/andro-org.png" alt="Andromeda logo">
        <div>
          <h1 class="admin-brand__title">Andromeda Admin</h1>
          <p class="admin-brand__subtitle">Matches</p>
        </div>
      </div>
      <div class="admin-user">
        <a href="index.html" class="admin-btn admin-btn--secondary">Dashboard</a>
        <a href="../pages/admin-tournaments.html" class="admin-btn admin-btn--secondary">Tournament History</a>
        <a href="scrims.html" class="admin-btn admin-btn--secondary">Match Reports</a>
        <span>Signed in as <strong data-admin-email>—</strong></span>
        <button type="button" class="admin-btn admin-btn--secondary" data-admin-signout>Sign out</button>
      </div>
    </header>

    <section class="admin-grid admin-grid--two">
      <article class="admin-card">
        <h2>Create or Edit Match</h2>
        <form id="match-form" class="admin-grid">
          <input type="hidden" id="match-id">

          <div>
            <label class="admin-label" for="match-team">Team</label>
            <select class="admin-select" id="match-team" required>
              <option value="">Select team</option>
              <option value="horizon">Horizon</option>
              <option value="spiral">Spiral</option>
              <option value="proxima">Proxima</option>
              <option value="comet">Comet</option>
              <option value="supernova">Supernova</option>
              <option value="void">Void</option>
              <option value="faceit">Andromeda: FACEIT</option>
            </select>
          </div>

          <div>
            <label class="admin-label" for="match-opponent">Opponent</label>
            <input class="admin-input" id="match-opponent" type="text" placeholder="Opponent name" required>
          </div>

          <div class="admin-grid admin-grid--two">
            <div>
              <label class="admin-label" for="match-date">Date</label>
              <input class="admin-input" id="match-date" type="date" required>
            </div>
            <div>
              <label class="admin-label" for="match-time">Time</label>
              <input class="admin-input" id="match-time" type="time" required>
            </div>
          </div>

          <div>
            <label class="admin-label" for="match-stream-url">Stream URL (optional)</label>
            <input class="admin-input" id="match-stream-url" type="url" placeholder="https://...">
          </div>

          <div class="admin-inline-actions">
            <button id="save-match-btn" class="admin-btn admin-btn--primary" type="submit">Create Match</button>
            <button id="clear-match-btn" class="admin-btn admin-btn--secondary" type="button">Clear</button>
          </div>
          <p id="match-form-status" class="admin-status admin-text-muted">Ready to create a match.</p>
        </form>
      </article>

      <article class="admin-card">
        <h2>Upcoming Matches</h2>
        <div class="admin-inline-actions">
          <button id="refresh-matches-btn" type="button" class="admin-btn admin-btn--secondary">Refresh</button>
          <button id="sort-direction-btn" type="button" class="admin-btn admin-btn--secondary">Sort: Soonest first</button>
        </div>
        <p id="match-list-status" class="admin-status admin-text-muted">Loading upcoming matches...</p>
        <div id="upcoming-matches-list" class="admin-grid"></div>
      </article>
    </section>
  </main>

  <script type="module" src="/js/admin/admin-gate.ui.js"></script>
  <script type="module" src="js/matches.js"></script>
</body>
</html>
