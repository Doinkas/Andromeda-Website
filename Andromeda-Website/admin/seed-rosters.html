<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andromeda Admin Seed Rosters</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <main id="adminApp" hidden class="admin-shell">
    <header class="admin-topbar">
      <div class="admin-brand">
        <img class="admin-brand__logo" src="../images/branding/andro-org.png" alt="Andromeda logo">
        <div>
          <h1 class="admin-brand__title">Andromeda Admin</h1>
          <p class="admin-brand__subtitle">Seed Rosters</p>
        </div>
      </div>
      <div class="admin-user">
        <a href="index.html" class="admin-btn admin-btn--secondary">Dashboard</a>
        <span>Signed in as <strong data-admin-email>—</strong></span>
        <button type="button" class="admin-btn admin-btn--secondary" data-admin-signout>Sign out</button>
      </div>
    </header>

    <section class="admin-card" style="max-width: 900px;">
      <h2>Seed Firestore Rosters</h2>
      <p>This tool reads pages/teams.html and writes the parsed roster to Firestore.</p>

      <div class="admin-inline-actions">
        <button id="seed-btn" class="admin-btn admin-btn--primary" type="button">Seed Rosters</button>
      </div>

      <pre id="status" class="admin-card" style="margin-top: 14px; white-space: pre-wrap;"></pre>
    </section>
  </main>

  <script type="module" src="/js/admin/admin-gate.ui.js"></script>
  <script type="module" src="js/seed-rosters.js"></script>
</body>
</html>
