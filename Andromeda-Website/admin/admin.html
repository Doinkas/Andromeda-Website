<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andromeda Admin Rosters and Trials</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <main id="adminApp" hidden class="admin-shell">
    <header class="admin-topbar">
      <div class="admin-brand">
        <img class="admin-brand__logo" src="../images/branding/andro-org.png" alt="Andromeda logo">
        <div>
          <h1 class="admin-brand__title">Andromeda Admin</h1>
          <p class="admin-brand__subtitle">Rosters and Trials</p>
        </div>
      </div>
      <div class="admin-user">
        <a href="index.html" class="admin-btn admin-btn--secondary">Dashboard</a>
        <a href="../pages/admin-tournaments.html" class="admin-btn admin-btn--secondary">Tournament History</a>
        <a href="matches.html" class="admin-btn admin-btn--secondary">Matches</a>
        <a href="scrims.html" class="admin-btn admin-btn--secondary">Match Reports</a>
        <span>Signed in as <strong data-admin-email>—</strong></span>
        <button type="button" class="admin-btn admin-btn--secondary" data-admin-signout>Sign out</button>
      </div>
    </header>

    <section class="admin-grid admin-grid--two">
      <article class="admin-card" aria-labelledby="roster-heading">
        <h2 id="roster-heading">Edit Team Roster</h2>

        <div>
          <label class="admin-label" for="team-select">Select Team</label>
          <select id="team-select" class="admin-select">
            <option value="">Select a team</option>
            <option value="horizon">Horizon</option>
            <option value="spiral">Spiral</option>
            <option value="proxima">Proxima</option>
            <option value="comet">Comet</option>
            <option value="supernova">Supernova</option>
            <option value="void">Void</option>
            <option value="polaris">Polaris</option>
            <option value="faceit">Andromeda: FACEIT</option>
          </select>
        </div>

        <p id="roster-message" class="admin-status admin-text-muted" role="status" aria-live="polite"></p>

        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Player</th>
                <th>Roles</th>
                <th>Lineup</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="roster-table-body"></tbody>
          </table>
        </div>

        <div class="admin-grid" style="margin-top: 14px;">
          <div>
            <label class="admin-label" for="player-name">Player Name</label>
            <input id="player-name" class="admin-input" type="text" placeholder="Enter player name">
          </div>

          <div>
            <label class="admin-label" for="player-lineup">Lineup</label>
            <select id="player-lineup" class="admin-select">
              <option value="starter">Starter</option>
              <option value="sub">Sub</option>
            </select>
          </div>

          <fieldset class="admin-fieldset"></fieldset>

          <div class="admin-inline-actions">
            <button id="add-player-btn" class="admin-btn admin-btn--secondary" type="button">Add Player</button>
            <button id="save-roster-btn" class="admin-btn admin-btn--primary" type="button">Save Roster</button>
            <button id="import-html-btn" class="admin-btn admin-btn--secondary" type="button">Import From Teams HTML</button>
          </div>
        </div>

        <hr style="border: none; border-top: 1px solid var(--border-subtle); margin: 18px 0;">

        <h3>Team Profile Data</h3>
        <p class="admin-text-muted">These values power the Teams quick overview and team profile pages.</p>

        <div class="admin-grid admin-grid--two">
          <div>
            <label class="admin-label" for="team-display-name">Display Name</label>
            <input id="team-display-name" class="admin-input" type="text" placeholder="Horizon">
          </div>
          <div>
            <label class="admin-label" for="team-tier">Tier</label>
            <input id="team-tier" class="admin-input" type="text" placeholder="T1 / FACEIT">
          </div>
          <div>
            <label class="admin-label" for="team-region">Region</label>
            <input id="team-region" class="admin-input" type="text" placeholder="NA">
          </div>
          <div>
            <label class="admin-label" for="team-rating">Rating</label>
            <input id="team-rating" class="admin-input" type="text" placeholder="FACEIT Masters">
          </div>
          <div>
            <label class="admin-label" for="team-manager">Manager</label>
            <input id="team-manager" class="admin-input" type="text" placeholder="Manager name">
          </div>
          <div>
            <label class="admin-label" for="team-coaches">Coaches</label>
            <input id="team-coaches" class="admin-input" type="text" placeholder="Coach names">
          </div>
          <div>
            <label class="admin-label" for="team-captain">Captain</label>
            <input id="team-captain" class="admin-input" type="text" placeholder="Captain name">
          </div>
        </div>

        <div class="admin-grid" style="margin-top: 10px;">
          <div>
            <label class="admin-label" for="team-description">Description</label>
            <textarea id="team-description" class="admin-textarea" rows="3" placeholder="Short team summary"></textarea>
          </div>
          <div>
            <label class="admin-label" for="team-highlights">Highlights (one per line)</label>
            <textarea id="team-highlights" class="admin-textarea" rows="3" placeholder="Communication habits"></textarea>
          </div>
          <div>
            <label class="admin-label" for="team-achievements">Achievements (one per line)</label>
            <textarea id="team-achievements" class="admin-textarea" rows="3" placeholder="FACEIT S5 Advanced Champions"></textarea>
          </div>
        </div>
      </article>

      <article class="admin-card" aria-labelledby="trials-heading">
        <h2 id="trials-heading">Trials Queue</h2>

        <div class="admin-grid admin-grid--two">
          <div>
            <label class="admin-label" for="trials-team-filter">Team</label>
            <select id="trials-team-filter" class="admin-select">
              <option value="">All</option>
              <option value="horizon">Horizon</option>
              <option value="spiral">Spiral</option>
              <option value="proxima">Proxima</option>
              <option value="comet">Comet</option>
              <option value="supernova">Supernova</option>
              <option value="void">Void</option>
              <option value="polaris">Polaris</option>
              <option value="faceit">Andromeda: FACEIT</option>
            </select>
          </div>
          <div>
            <label class="admin-label" for="trials-status-filter">Status</label>
            <select id="trials-status-filter" class="admin-select">
              <option value="">All</option>
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="rejected">Rejected</option>
              <option value="dropped">Dropped</option>
            </select>
          </div>
        </div>

        <div class="admin-inline-actions" style="margin-top: 10px;">
          <button id="refresh-trials-btn" class="admin-btn admin-btn--secondary" type="button">Refresh</button>
        </div>

        <p id="trials-message" class="admin-status admin-text-muted" role="status" aria-live="polite"></p>
        <div id="trials-list" class="admin-grid"></div>

        <hr style="border: none; border-top: 1px solid var(--border-subtle); margin: 18px 0;">

        <h3>Add Trial</h3>
        <div class="admin-grid">
          <div>
            <label class="admin-label" for="trial-name">Name</label>
            <input id="trial-name" class="admin-input" type="text" placeholder="Trial name">
          </div>

          <div>
            <label class="admin-label" for="trial-team">Team</label>
            <select id="trial-team" class="admin-select">
              <option value="">Select team</option>
              <option value="horizon">Horizon</option>
              <option value="spiral">Spiral</option>
              <option value="proxima">Proxima</option>
              <option value="comet">Comet</option>
              <option value="supernova">Supernova</option>
              <option value="void">Void</option>
              <option value="polaris">Polaris</option>
              <option value="faceit">Andromeda: FACEIT</option>
            </select>
          </div>

          <fieldset class="admin-fieldset">
            <legend>Roles</legend>
            <label><input type="checkbox" name="trial-roles" value="TANK"> Tank</label>
            <label><input type="checkbox" name="trial-roles" value="DPS"> DPS</label>
            <label><input type="checkbox" name="trial-roles" value="SUPPORT"> Support</label>
            <label><input type="checkbox" name="trial-roles" value="STAFF"> Staff</label>
          </fieldset>

          <div>
            <label class="admin-label" for="trial-notes">Notes</label>
            <textarea id="trial-notes" class="admin-textarea" rows="3" placeholder="Notes"></textarea>
          </div>

          <div class="admin-inline-actions">
            <button id="add-trial-btn" class="admin-btn admin-btn--primary" type="button">Add Trial</button>
          </div>
        </div>
      </article>
    </section>
  </main>

  <script type="module" src="/js/admin/admin-gate.ui.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
